name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: scripts/check.sh
        run: bash scripts/check.sh

  smoke:
    # Builds the real image and runs it against a real Postgres.
    # Skips itself until a Dockerfile exists.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect
        id: detect
        run: |
          echo "docker=$([ -f Dockerfile ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "migrate=$([ -f scripts/migrate.mjs ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.docker == 'yes'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.detect.outputs.docker == 'yes'
        name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: revenant:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.detect.outputs.docker == 'yes' && steps.detect.outputs.migrate == 'yes'
        name: Migrate (twice, must be idempotent)
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
        run: |
          for i in 1 2; do
            docker run --rm --network host -e DATABASE_URL revenant:ci node scripts/migrate.mjs
          done
      - if: steps.detect.outputs.docker == 'yes'
        name: Run image and probe
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://postgres:ci@localhost:5432/postgres \
            -e PORT=3000 -e HOSTNAME=0.0.0.0 revenant:ci
          paths="/ /api/health"
          [ "${{ steps.detect.outputs.migrate }}" = yes ] && paths="$paths /api/health/ready"
          for p in $paths; do
            ok=no
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$p" || true)
              if [ "$code" = 200 ]; then ok=yes; break; fi
              sleep 1
            done
            echo "$p -> $code"
            if [ "$ok" != yes ]; then docker logs app; exit 1; fi
          done
      - if: steps.detect.outputs.docker == 'no'
        run: echo "No Dockerfile yet; smoke test skipped."

  ci-gate:
    # The single required status check for main.
    if: always()
    needs: [checks, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          [ "${{ needs.checks.result }}" = success ] && [ "${{ needs.smoke.result }}" = success ]

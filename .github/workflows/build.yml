name: build

# Pushes the image to GHCR only after CI passed for the same commit on main,
# and for version tags.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip without Dockerfile
        id: has
        run: echo "docker=$([ -f Dockerfile ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.docker == 'yes'
        id: go
        run: echo "ok=yes" >> "$GITHUB_OUTPUT"
      - if: steps.go.outputs.ok == 'yes'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.go.outputs.ok == 'yes'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.go.outputs.ok == 'yes'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/devclef/revenant
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }},enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}}
      - if: steps.go.outputs.ok == 'yes'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.event.workflow_run.head_sha || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
